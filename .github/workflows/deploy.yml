name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Deployments(repo → Environments)에 배포 기록·URL을 남긴다.
    environment:
      name: production
      url: https://0101-commits-job-analysis-seoyon.baldr0001.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # VITE_* 는 빌드 시점에 클라이언트 번들로 인라인된다.
      # 버전과 빌드 시각은 관리자 화면 상단 운영 표시줄이 읽는다 —
      # "배포했다는데 화면이 그대로"인 상황을 눈으로 판별하기 위한 값이다.
      - name: Build
        run: |
          # 수동 실행(workflow_dispatch)에는 커밋 시각이 없으므로 현재 시각으로 채운다.
          export VITE_BUILD_TIME="${VITE_BUILD_TIME:-$(date -Is)}"
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      # 산출물 wrangler.json 은 매 빌드 초기화되므로 서버 런타임 vars 와 cron 트리거를 주입한다.
      - name: Inject server vars & cron trigger
        run: |
          node -e '
            const fs = require("fs");
            const p = ".output/server/wrangler.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.vars = {
              SUPABASE_URL: process.env.SUPABASE_URL,
              SUPABASE_PUBLISHABLE_KEY: process.env.SUPABASE_PUBLISHABLE_KEY,
              APP_URL: process.env.APP_URL,
            };
            if (process.env.SUPABASE_SERVICE_ROLE_KEY) j.vars.SUPABASE_SERVICE_ROLE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
            if (process.env.RESEND_API_KEY) j.vars.RESEND_API_KEY = process.env.RESEND_API_KEY;
            if (process.env.RESEND_FROM) j.vars.RESEND_FROM = process.env.RESEND_FROM;
            if (process.env.ELIZAX_PROXY_URL) j.vars.ELIZAX_PROXY_URL = process.env.ELIZAX_PROXY_URL;
            // 정기 실행(POST /api/cron) 인증 토큰. cron.yml 이 같은 값을 헤더로 보낸다.
            if (process.env.CRON_TOKEN) j.vars.CRON_TOKEN = process.env.CRON_TOKEN;
            // 같은 계정 workers.dev 간 fetch(오류 1042) 우회 — elizax-proxy 서비스 바인딩
            j.services = [{ binding: "ELIZAX_PROXY", service: "elizax-proxy" }];
            // 자동 백업/리마인더/예약 발송용 cron (UTC 21:00·09:00 = KST 06:00·18:00).
            // 기본 실행 경로는 GitHub Actions(.github/workflows/cron.yml → POST /api/cron)다.
            // CF 무료 플랜은 계정당 cron 5개 상한이라, 여유가 있는 계정에서 ENABLE_CRON=1 을
            // 넣었을 때만 CF cron 도 함께 등록한다(둘 다 같은 실행기를 부른다).
            if (process.env.ENABLE_CRON === "1") j.triggers = { crons: ["0 21,9 * * *"] };
            fs.writeFileSync(p, JSON.stringify(j, null, 2));
            console.log("injected vars:", Object.keys(j.vars).join(", "));
          '
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ELIZAX_PROXY_URL: ${{ secrets.ELIZAX_PROXY_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          ENABLE_CRON: ${{ secrets.ENABLE_CRON }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
